# UAR / Brand Concierge visual regression
#
# Source: UAR/BC release tracker — every page where the BC entry blade,
# floating banner, or hero variant is currently live, paused, or planned.
#
# Pattern (milolibs mode):
#   a: <stage URL>                       — current prod milo on stage page
#   b: <stage URL>?milolibs=stage        — milo-stage candidate on stage page
# Diff = what milo-stage will change for UAR/BC pages when it ships to prod.
#
# UAR has lazy entry-blade injection (Target treatment + IntersectionObserver-
# driven personalization). Without scrolling, screenshots capture the page
# before BC mounts. Scroll-then-screenshot is required.
#
# NOTE: BC may not appear in incognito-style headless sessions without
# ?promoid=brandcon (internal employee override — see release tracker).
# If diffs come back empty for BC-specific elements, append &promoid=brandcon
# to every URL below and re-run.
__config__:
  waitStrategy: scroll

