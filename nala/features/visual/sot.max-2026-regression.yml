# MAX 2026 Floodgate Regression (MWPW-201418)
#
# Compares www.stage.adobe.com (through Akamai + Edge Worker) vs the
# corresponding aem.live origin. Any diff = something Akamai/EW is doing.
#
# AC coverage:
#   AC1  Non-FG paths render unchanged
#   AC2  Edge Worker only executes on FG-tagged paths
#   AC3  Direct-URL FG-pink access is gated (anonymous should not see FG)
#
# URL curation: adobe.com "approved products" list + JIRA MWPW-201418 samples.
# Skipped from approved list (independent Akamai property, unaffected):
#   stock.adobe.com, fonts.adobe.com, behance.net, frame.io,
#   business.adobe.com/*, developer.adobe.com/*

__config__:
  waitStrategy: scroll

# ─────────────────────────────────────────────────────────────────
# CLASS 1 — Homepage (US + locale) — AC1
# High-traffic + Akamai geo routing (most common bleed source)
# ─────────────────────────────────────────────────────────────────

homepage-us:
  a: 'https://www.stage.adobe.com/?mep=off'
  b: 'https://main--milo--adobecom.aem.live/?mep=off'

homepage-uk:
  a: 'https://www.stage.adobe.com/uk/?mep=off&akamaiLocale=uk'
  b: 'https://main--milo--adobecom.aem.live/uk/?mep=off'

homepage-de:
  a: 'https://www.stage.adobe.com/de?akamaiLocale=de'
  b: 'https://main--milo--adobecom.aem.live/de'

