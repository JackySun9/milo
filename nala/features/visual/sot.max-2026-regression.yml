# MAX 2026 Floodgate Regression (MWPW-201418)
#
# Compares www.adobe.com (prod, Floodgate NOT active) vs
# www.stage.adobe.com (Floodgate active on stage).
# Both go through Akamai and share the same tech stack (martech, gnav,
# personalization) — so any diff should be attributable to the Floodgate
# activation, not infra noise.
#
# Expected behaviour (anonymous / not-logged-in run):
#   - Non-FG pages     : prod == stage        (visually equal)
#   - FG paths (max/*, chimera-api/*, max-new.html):
#       prod  = default (FG not active in prod)
#       stage = 404      (anonymous is gated)
#       → diff EXPECTED
#
# A follow-up run with logged-in allowlist user should show:
#   - Non-FG pages : still identical
#   - FG paths     : stage renders FG content, prod stays default → diff expected

__config__:
  waitStrategy: scroll

# ─────────────────────────────────────────────────────────────────
# CLASS 1 — Homepage (US + locale) — AC1
# Non-FG. Expected: identical (prod == stage).
# ─────────────────────────────────────────────────────────────────

homepage-us:
  a: 'https://www.adobe.com/?mep=off'
  b: 'https://www.stage.adobe.com/?mep=off'

homepage-uk:
  a: 'https://www.adobe.com/uk/?mep=off&akamaiLocale=uk'
  b: 'https://www.stage.adobe.com/uk/?mep=off&akamaiLocale=uk'

homepage-de:
  a: 'https://www.adobe.com/de?akamaiLocale=de'
  b: 'https://www.stage.adobe.com/de?akamaiLocale=de'

