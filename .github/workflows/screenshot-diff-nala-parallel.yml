name: Screenshot Diff (Parallel Matrix)

# Runs visual regression for one site across 3 viewports in parallel
# on the self-hosted Mac Mini pool.
#
# The merge step is bundled into the iphone capture job (iphone is
# reliably the last viewport to finish). This eliminates the separate
# `merge` job and the queueing it caused: with 6 runners and 7 sites,
# 7 separate merge jobs would pile up behind 21 capture jobs and the
# whole batch was waiting for the last capture before any merge could
# claim a runner.
#
# Iphone polls S3 (via nala-auto proxy) for the chrome and ipad shards,
# then runs lib/merge.js, then uploads the consolidated results.json.
#
# shards (1-4) splits the page list further: every viewport runs N jobs,
# each capturing a contiguous slice (SHARD=k/N in sot.run.js), so a large
# dataset fans out across idle runners instead of 3 long jobs. iphone shard 1
# owns the merge and waits for every other capture job.
#
# Result URL after completion:
#   http://nala-auto.corp.adobe.com/imagediff/<site>

run-name: ${{ inputs.run_id && format('Screenshot Diff [{0}]', inputs.run_id) || 'Screenshot Diff (Parallel Matrix)' }}

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site (matches nala/features/visual/sot.<site>.yml)'
        required: true
        default: 'bacom'
        type: choice
        options:
          - bacom
          - bacom-blog
          - cc
          - da-marketo
          - da-marketo-prod
          - dc
          - express
          - graybox-bacom
          - graybox-cc
          - graybox-dc
          - graybox-upp
          - homepage
          - uar
          - custom
      custom_site:
        description: 'Custom site name when site=custom, e.g. bacom-live-qa'
        required: false
        type: string
      milo_libs:
        description: 'Query string appended to URL B (the candidate)'
        required: false
        default: '?milolibs=stage'
        type: string
      urls:
        description: 'Quick run: newline-separated URLs ("url" or "urlA | urlB") replacing the site list. Use with site=custom and a fresh custom_site.'
        required: false
        type: string
      viewports:
        description: 'Comma-separated subset of chrome,ipad,iphone to capture'
        required: false
        default: 'chrome,ipad,iphone'
        type: string
      figma_url:
        description: 'Figma compare: share URL with node-id (e.g. https://www.figma.com/design/KEY/Name?node-id=83-45998). When set, runs the single-element Figma comparison instead of the dataset capture.'
        required: false
        type: string
      selector:
        description: 'Figma compare: CSS selector of the web element to compare. Must match exactly one element. Required when figma_url is set.'
        required: false
        type: string
      shards:
        description: 'Split each viewport into N parallel jobs (1-4) by slicing the page list'
        required: false
        default: '1'
        type: string
      run_id:
        description: 'Version id for the immutable per-run copy on S3. Defaults to this GitHub run id.'
        required: false
        type: string

jobs:
  capture:
    name: capture-${{ matrix.viewport }}${{ strategy.job-total > 3 && format('-{0}', matrix.shard) || '' }}
    if: inputs.figma_url == ''
    env:
      SITE: ${{ inputs.site == 'custom' && inputs.custom_site || inputs.site }}
      CUSTOM_SITE: ${{ inputs.custom_site }}
      VIEWPORTS_IN: ${{ inputs.viewports || 'chrome,ipad,iphone' }}
      # The matrix stays fixed because the iphone job owns the merge; a
      # deselected viewport's job just skips its capture steps.
      VP_ENABLED: ${{ contains(format(',{0},', inputs.viewports || 'chrome,ipad,iphone'), format(',{0},', matrix.viewport)) }}
    strategy:
      fail-fast: false
      matrix:
        viewport: [chrome, ipad, iphone]
        shard: ${{ fromJSON((inputs.shards == '2' && '[1,2]') || (inputs.shards == '3' && '[1,2,3]') || (inputs.shards == '4' && '[1,2,3,4]') || '[1]') }}
    runs-on: [self-hosted, macOS, screendiff]
    timeout-minutes: 90

    steps:
      - name: Validate site
        run: |
          if [ "${{ inputs.site }}" = "custom" ] && [ -z "$SITE" ]; then
            echo "::error::custom_site is required when site=custom"
            exit 1
          fi
          if [ "${{ inputs.site }}" != "custom" ] && [ -n "$CUSTOM_SITE" ]; then
            echo "::error::custom_site must be empty unless site=custom"
            exit 1
          fi

      # The viewport list is fixed at 3, so shards = job-total / 3. With one
      # shard the names stay chrome/ipad/iphone (results-<viewport>.json).
      - name: Resolve shard
        env:
          JOB_TOTAL: ${{ strategy.job-total }}
          SHARD_IDX: ${{ matrix.shard }}
          VP: ${{ matrix.viewport }}
        run: |
          total=$(( JOB_TOTAL / 3 ))
          if [ "$total" -gt 1 ]; then name="$VP-$SHARD_IDX"; else name="$VP"; fi
          echo "SHARD_TOTAL=$total" >> "$GITHUB_ENV"
          echo "SHARD_NAME=$name" >> "$GITHUB_ENV"
          echo "Shard $SHARD_IDX/$total → results-$name.json"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install milo dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: env.VP_ENABLED == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run visual diff (this viewport only)
        if: env.VP_ENABLED == 'true'
        env:
          VIEWPORTS: ${{ matrix.viewport }}
          SHARD: ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}
          MILO_LIBS: ${{ inputs.milo_libs }}
          URLS: ${{ inputs.urls }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3ACCESSKEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3SECRETKEY }}
        run: node nala/features/visual/sot.run.js

      # Each viewport captures on its own runner, so only this job has these
      # PNGs on disk — copy them into the run's immutable prefix now. The
      # iphone job's final publish then only writes results.json + the index.
      - name: Upload this viewport's images to the versioned run
        if: env.VP_ENABLED == 'true' && success()
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3ACCESSKEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3SECRETKEY }}
          RUN_ID: ${{ inputs.run_id || github.run_id }}
        run: node tools/screenshot-diff/lib/publish-run.js screenshots/$SITE "$SITE" "$RUN_ID" --images results-$SHARD_NAME.json

      - name: Upload shard JSON to GH artifacts
        if: always() && env.VP_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ env.SITE }}-${{ env.SHARD_NAME }}
          path: screenshots/${{ env.SITE }}/results-${{ env.SHARD_NAME }}.json
          retention-days: 7

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # iphone shard 1 only: bundle the merge into this job (iphone is the
      # slowest viewport, so by the time we get here the other shards are
      # usually already uploaded to S3). No separate merge job → no queue gap.
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Wait for every sibling capture job in THIS run to finish
        if: matrix.viewport == 'iphone' && matrix.shard == 1 && success()
        env:
          GH_TOKEN: ${{ github.token }}
          SELF: capture-${{ env.SHARD_NAME }}
          API_URL: https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs
        run: |
          # Wait on the SIBLING JOBS in this run, not on file presence on
          # S3 (S3 shards persist from previous runs — presence-only check
          # pulls last-run data). Use curl + node (node is already on PATH
          # from setup-node; `python3` on bare macOS triggers the Xcode
          # CLT install prompt, while `gh` CLI isn't installed at all).
          expected=$(( SHARD_TOTAL * 3 - 1 ))
          for i in $(seq 1 360); do
            # Tolerate transient GitHub API errors (5xx returns an HTML "Unicorn"
            # page, not JSON). On any curl/parse failure treat as 0-done and retry,
            # so one API hiccup doesn't kill the job under `set -eo pipefail`.
            resp=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API_URL" || true)
            done_count=$(printf '%s' "$resp" | node -e "let d={};try{d=JSON.parse(require('fs').readFileSync(0,'utf8'))}catch(e){}const j=Array.isArray(d.jobs)?d.jobs:[];console.log(j.filter(x=>x.name.startsWith('capture-')&&x.name!==process.env.SELF&&x.status==='completed').length)")
            if [ "$done_count" = "$expected" ]; then
              echo "✓ all $expected sibling capture jobs completed"
              break
            fi
            echo "Waiting (${done_count:-0}/$expected sibling jobs done) ..."
            sleep 10
          done

      - name: Pull fresh sibling shards from S3
        if: matrix.viewport == 'iphone' && matrix.shard == 1 && success()
        run: |
          mkdir -p "screenshots/$SITE"
          for vp in chrome ipad iphone; do
            # Never merge a deselected viewport's shard — whatever is on S3
            # for it is left over from an earlier run.
            case ",$VIEWPORTS_IN," in *",$vp,"*) ;; *) echo "skip $vp (not selected)"; continue ;; esac
            for k in $(seq 1 "$SHARD_TOTAL"); do
            if [ "$SHARD_TOTAL" -gt 1 ]; then shard="$vp-$k"; else shard="$vp"; fi
            [ "$shard" = "$SHARD_NAME" ] && continue
            if curl -sSf -o "screenshots/$SITE/results-$shard.json" \
                 "http://nala-auto.corp.adobe.com/api/milo/screenshots/$SITE/results-$shard.json"; then
              echo "✓ pulled $shard shard"
            else
              echo "::warning::No $shard shard on S3 — merge will proceed without it"
            fi
            done
          done

      - name: Merge shards into results.json
        if: matrix.viewport == 'iphone' && matrix.shard == 1 && success()
        run: node tools/screenshot-diff/lib/merge.js screenshots/$SITE

      - name: Upload merged results.json to S3
        if: matrix.viewport == 'iphone' && matrix.shard == 1 && success()
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3ACCESSKEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3SECRETKEY }}
        run: node tools/screenshot-diff/lib/upload-one.js screenshots/$SITE/results.json

      - name: Publish immutable versioned copy of this run
        if: matrix.viewport == 'iphone' && matrix.shard == 1 && success()
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3ACCESSKEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3SECRETKEY }}
          RUN_ID: ${{ inputs.run_id || github.run_id }}
        run: node tools/screenshot-diff/lib/publish-run.js screenshots/$SITE "$SITE" "$RUN_ID"

      - name: Write fresh timestamp + upload
        if: matrix.viewport == 'iphone' && matrix.shard == 1 && success()
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3ACCESSKEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3SECRETKEY }}
        run: |
          node -e "require('fs').writeFileSync('screenshots/$SITE/timestamp.json', JSON.stringify([new Date().toLocaleString()], null, 2))"
          node tools/screenshot-diff/lib/upload-one.js screenshots/$SITE/timestamp.json

      - name: Print result URL
        if: matrix.viewport == 'iphone' && matrix.shard == 1 && success()
        run: |
          echo "::notice title=View results::http://nala-auto.corp.adobe.com/imagediff/$SITE"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Figma compare: ONE Figma node vs ONE DOM element, ONE viewport.
  # Writes the same results.json shape as the dataset capture, so
  # /imagediff/<site> renders it with no UI change.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  figma-compare:
    name: figma-compare
    if: inputs.figma_url != ''
    env:
      SITE: ${{ inputs.site == 'custom' && inputs.custom_site || inputs.site }}
    runs-on: [self-hosted, macOS, screendiff]
    timeout-minutes: 30

    steps:
      - name: Validate figma inputs
        run: |
          if [ -z "$SITE" ]; then
            echo "::error::custom_site is required when site=custom"
            exit 1
          fi
          if [ -z "${{ inputs.selector }}" ]; then
            echo "::error::selector is required when figma_url is set"
            exit 1
          fi
          if [ -z "${{ inputs.urls }}" ]; then
            echo "::error::urls must contain exactly one web URL when figma_url is set"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install milo dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Figma vs web comparison
        env:
          FIGMA_URL: ${{ inputs.figma_url }}
          SELECTOR: ${{ inputs.selector }}
          URLS: ${{ inputs.urls }}
          VIEWPORTS: ${{ inputs.viewports || 'chrome' }}
          RUN_ID: ${{ inputs.run_id || github.run_id }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3ACCESSKEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3SECRETKEY }}
        run: node nala/features/visual/figma.run.js

      - name: Upload results JSON to GH artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-figma-${{ env.SITE }}
          path: screenshots/${{ env.SITE }}/results.json
          retention-days: 7

      - name: Print result URL
        if: success()
        run: |
          echo "::notice title=View results::http://nala-auto.corp.adobe.com/imagediff/$SITE"
