name: Screenshot Diff (Parallel Matrix)

# Runs visual regression for one site's data file across 3 viewports in
# parallel on the self-hosted Mac Mini pool, then a fan-in merge job
# consolidates the per-viewport results.json files into a single one that
# nala-auto reads.
#
# 3-shard matrix (one job per viewport) — uses 3 of the 6 runners per
# site, so 2 sites can run concurrently. Iphone is the slowest viewport
# but splitting it across more shards (we tried 4-shard with iphone-1of2
# + iphone-2of2) only helps when you have ≥8 runners; with 6 it
# starves the merge jobs.
#
# Result URL after completion:
#   http://nala-auto.corp.adobe.com/imagediff/<site>

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site (matches nala/features/visual/sot.<site>.yml — e.g. bacom, graybox-poc)'
        required: true
        default: 'bacom'
        type: string
      milo_libs:
        description: 'Query string appended to URL B (the candidate)'
        required: false
        default: '?milolibs=stage'
        type: string

jobs:
  capture:
    name: capture-${{ matrix.viewport }}
    strategy:
      fail-fast: false  # don't kill other viewports if one fails
      matrix:
        viewport: [chrome, ipad, iphone]
    runs-on: [self-hosted, macOS, screendiff]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install milo dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual diff (this viewport only)
        env:
          SITE: ${{ inputs.site }}
          VIEWPORTS: ${{ matrix.viewport }}
          SHARD_NAME: ${{ matrix.viewport }}
          MILO_LIBS: ${{ inputs.milo_libs }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3ACCESSKEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3SECRETKEY }}
        run: node nala/features/visual/sot.run.js

      - name: Upload shard JSON to GH artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.site }}-${{ matrix.viewport }}
          path: screenshots/${{ inputs.site }}/results-${{ matrix.viewport }}.json
          retention-days: 7

  merge:
    name: merge & publish
    needs: capture
    if: always()
    runs-on: [self-hosted, macOS, screendiff]
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Merge only needs @aws-sdk/client-s3 (for upload-one.js) — skip the
      # full milo `npm ci` which is ~60 s. Direct install of one dep is
      # ~5 s on warm cache.
      - name: Install merge deps only
        run: npm install --no-save --no-package-lock @aws-sdk/client-s3

      - name: Pull shard JSONs from S3 (via nala-auto proxy)
        run: |
          mkdir -p screenshots/${{ inputs.site }}
          for shard in chrome ipad iphone; do
            url="http://nala-auto.corp.adobe.com/api/milo/screenshots/${{ inputs.site }}/results-$shard.json"
            if curl -sSf -o "screenshots/${{ inputs.site }}/results-$shard.json" "$url"; then
              echo "✓ Pulled $shard shard"
            else
              echo "⚠ No shard for $shard (capture job may have failed)"
            fi
          done

      - name: Merge shards into results.json
        run: node tools/screenshot-diff/lib/merge.js screenshots/${{ inputs.site }}

      - name: Upload merged results.json to S3
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3ACCESSKEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3SECRETKEY }}
        run: node tools/screenshot-diff/lib/upload-one.js screenshots/${{ inputs.site }}/results.json

      - name: Write fresh timestamp + upload
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3ACCESSKEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3SECRETKEY }}
        run: |
          node -e "require('fs').writeFileSync('screenshots/${{ inputs.site }}/timestamp.json', JSON.stringify([new Date().toLocaleString()], null, 2))"
          node tools/screenshot-diff/lib/upload-one.js screenshots/${{ inputs.site }}/timestamp.json

      - name: Print result URL
        run: |
          echo "::notice title=View results::http://nala-auto.corp.adobe.com/imagediff/${{ inputs.site }}"
