name: Screenshot Diff (Parallel Matrix)

# Runs visual regression for one site's data file across all viewports in
# parallel on the self-hosted Mac Mini pool, then a fan-in merge job
# consolidates the per-shard results.json files into a single one that
# nala-auto reads.
#
# Matrix is matrix.include rather than a plain product, so the slowest
# viewport (iphone) can be split across two shards. Total shape:
#   capture-chrome        full URL list
#   capture-ipad          full URL list
#   capture-iphone-1of2   first half of URL list
#   capture-iphone-2of2   second half
#
# Result URL after completion:
#   http://nala-auto.corp.adobe.com/imagediff/<site>

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site (matches nala/features/visual/sot.<site>.yml — e.g. bacom, graybox-poc)'
        required: true
        default: 'bacom'
        type: string
      milo_libs:
        description: 'Query string appended to URL B (the candidate)'
        required: false
        default: '?milolibs=stage'
        type: string

jobs:
  capture:
    name: capture-${{ matrix.shard_name }}
    strategy:
      fail-fast: false  # don't kill other viewports if one fails
      matrix:
        include:
          - viewport: chrome
            shard: '1/1'
            shard_name: chrome
          - viewport: ipad
            shard: '1/1'
            shard_name: ipad
          - viewport: iphone
            shard: '1/2'
            shard_name: iphone-1of2
          - viewport: iphone
            shard: '2/2'
            shard_name: iphone-2of2
    runs-on: [self-hosted, macOS, screendiff]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install milo dependencies (cache miss only)
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual diff (this shard only)
        env:
          SITE: ${{ inputs.site }}
          VIEWPORTS: ${{ matrix.viewport }}
          SHARD: ${{ matrix.shard }}
          SHARD_NAME: ${{ matrix.shard_name }}
          MILO_LIBS: ${{ inputs.milo_libs }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3ACCESSKEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3SECRETKEY }}
        run: node nala/features/visual/sot.run.js

      - name: Upload shard JSON to GH artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.site }}-${{ matrix.shard_name }}
          path: screenshots/${{ inputs.site }}/results-${{ matrix.shard_name }}.json
          retention-days: 7

  merge:
    name: merge & publish
    needs: capture
    if: always()
    runs-on: [self-hosted, macOS, screendiff]
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install milo dependencies (cache miss only)
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Pull shard JSONs from S3 (via nala-auto proxy)
        run: |
          mkdir -p screenshots/${{ inputs.site }}
          for shard in chrome ipad iphone-1of2 iphone-2of2; do
            url="http://nala-auto.corp.adobe.com/api/milo/screenshots/${{ inputs.site }}/results-$shard.json"
            if curl -sSf -o "screenshots/${{ inputs.site }}/results-$shard.json" "$url"; then
              echo "✓ Pulled $shard shard"
            else
              echo "⚠ No shard for $shard (capture job may have failed)"
            fi
          done

      - name: Merge shards into results.json
        run: node tools/screenshot-diff/lib/merge.js screenshots/${{ inputs.site }}

      - name: Upload merged results.json to S3
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3ACCESSKEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3SECRETKEY }}
        run: node tools/screenshot-diff/lib/upload-one.js screenshots/${{ inputs.site }}/results.json

      - name: Write fresh timestamp + upload
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3ACCESSKEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3SECRETKEY }}
        run: |
          node -e "require('fs').writeFileSync('screenshots/${{ inputs.site }}/timestamp.json', JSON.stringify([new Date().toLocaleString()], null, 2))"
          node tools/screenshot-diff/lib/upload-one.js screenshots/${{ inputs.site }}/timestamp.json

      - name: Print result URL
        run: |
          echo "::notice title=View results::http://nala-auto.corp.adobe.com/imagediff/${{ inputs.site }}"
