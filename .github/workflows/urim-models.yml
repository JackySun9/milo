name: urim-models-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: [self-hosted, macOS, urim]
    env:
      K: ${{ secrets.AIFOUNDRY_API_KEY }}
    steps:
      - run: |
          for B in https://apigw.infra.adobe.net/ehl/api/v1 https://apigw.infra.adobe.net/ehl/api/v1/v1 https://apigw.infra.adobe.net/ehl/api https://apigw.infra.adobe.net/ehl/v1 https://apigw.infra.adobe.net/ehl; do
            echo "== BASE $B models: $(curl -s -m 20 -o /tmp/m.json -w '%{http_code}' -H "Authorization: Bearer $K" "$B/models") $(head -c 300 /tmp/m.json | tr -d '\n')"
            for m in "hosted_vllm/Qwen/Qwen3.8_AWS" "aifoundry/Qwen/Qwen-latest"; do
              s=$(date +%s)
              c=$(curl -s -m 120 -o /tmp/c.json -w '%{http_code}' -H "Authorization: Bearer $K" -H 'content-type: application/json' "$B/chat/completions" \
                -d "{\"model\":\"$m\",\"max_tokens\":150,\"messages\":[{\"role\":\"user\",\"content\":\"In 3 short bullets: top 2026 UI design trends.\"}]}")
              echo "  -- $m http=$c secs=$(( $(date +%s)-s )) $(head -c 700 /tmp/c.json | tr -d '\n')"
            done
          done
          rm -f /tmp/m.json /tmp/c.json
