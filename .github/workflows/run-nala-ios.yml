name: Nala iOS (Simulator) Screenshots

# Real iOS Simulator visual regression on the self-hosted Mac Mini pool.
# Captures each URL in sot.<site>.yml on real Mobile Safari (via Appium/XCUITest,
# FULL-PAGE), A (unmodified) vs B (+ milo_libs), pixel-diffs them, publishes into the
# SAME results.json the desktop screenshot-diff uses — so iOS shows up next to
# chrome/ipad/iphone at:  http://nala-auto.corp.adobe.com/imagediff/<site>
#
# Matrix = devices x ios_versions (each combo is one job, one reused simulator).
# Runners must be labeled [self-hosted, macOS, ios-sim] with full Xcode + the
# requested iOS runtime(s), in a logged-in GUI session.

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site (matches nala/features/visual/sot.<site>.yml)'
        required: true
        default: 'bacom'
        type: choice
        options:
          - bacom
          - bacom-blog
          - cc
          - da-marketo
          - da-marketo-prod
          - dc
          - express
          - graybox-bacom
          - graybox-cc
          - graybox-dc
          - graybox-upp
          - homepage
          - uar
      milo_libs:
        description: 'Query string appended to URL B (the candidate)'
        required: false
        default: '?milolibs=stage'
        type: string
      ios_versions:
        description: 'Comma-separated iOS versions, e.g. 18.3 or 17.5,18.3'
        required: true
        default: '18.3'
        type: string
      devices:
        description: 'Comma-separated devices (must match `xcrun simctl list devicetypes`)'
        required: false
        default: 'iPhone 15,iPad Pro 11-inch (M4)'
        type: string
      max_urls:
        description: 'Limit number of URLs (0 = all; set small e.g. 5 for a quick test)'
        required: false
        default: '0'
        type: string

jobs:
  prepare:
    runs-on: [self-hosted, macOS, ios-sim]
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - id: split
        shell: bash
        run: |
          # Minimum iOS version each device model can run. A device released after
          # an iOS version has no simulator build for it (e.g. iPhone 16 needs
          # iOS 18+), so pairing them just produces a guaranteed-fail job. Drop
          # those pairs here instead of dispatching them.
          min_ios() {
            case "$1" in
              "iPhone 16 Pro Max"|"iPhone 16 Pro"|"iPhone 16 Plus"|"iPhone 16") echo "18.0" ;;
              "iPad Air 11-inch (M2)"|"iPad Air 13-inch (M2)") echo "17.5" ;;
              "iPad Pro 11-inch (M4)"|"iPad Pro 13-inch (M4)") echo "17.4" ;;
              *) echo "0" ;;
            esac
          }
          # true when $1 (min) <= $2 (chosen), using version-aware sort.
          ge() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" = "$1" ]; }
          inc=""
          IFS=',' read -ra DL <<< "${{ inputs.devices }}"
          IFS=',' read -ra VL <<< "${{ inputs.ios_versions }}"
          for dev in "${DL[@]}"; do
            dev="$(echo "$dev" | sed 's/^ *//;s/ *$//')"
            for ios in "${VL[@]}"; do
              ios="$(echo "$ios" | sed 's/^ *//;s/ *$//')"
              min="$(min_ios "$dev")"
              if ge "$min" "$ios"; then
                inc="$inc{\"device\":\"$dev\",\"ios\":\"$ios\"},"
              else
                echo "::warning title=Skipped incompatible combo::$dev needs iOS $min+, skipping iOS $ios"
              fi
            done
          done
          if [ -z "$inc" ]; then
            echo "::error title=No runnable combinations::None of the selected devices can run on the selected iOS version(s). e.g. iPhone 16 needs iOS 18+."
            exit 1
          fi
          echo "matrix={\"include\":[${inc%,}]}" >> "$GITHUB_OUTPUT"

  capture:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: [self-hosted, macOS, ios-sim]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install milo dependencies
        run: npm ci

      - name: Ensure iOS runtime ${{ matrix.ios }}
        run: ./ios-runner/simulators.sh ensure "${{ matrix.ios }}" || true

      - name: Capture ${{ matrix.device }} · iOS ${{ matrix.ios }} (Appium full-page)
        env:
          SITE: ${{ inputs.site }}
          MILO_LIBS: ${{ inputs.milo_libs }}
          IOS_VERSION: ${{ matrix.ios }}
          IOS_DEVICE: ${{ matrix.device }}
          IOS_MAX_URLS: ${{ inputs.max_urls }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3ACCESSKEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3SECRETKEY }}
        run: |
          # Appium is pre-installed under nvm on ios-sim runners. Put nvm's node
          # bin on PATH just for the appium process (its shebang needs node); the
          # capture then runs with the job's own node (resolves milo node_modules).
          NODE_BIN="$(dirname "$(ls "$HOME"/.nvm/versions/node/*/bin/node 2>/dev/null | head -1)")"
          echo "Using nvm node bin: $NODE_BIN"
          PATH="$NODE_BIN:$PATH" appium --base-path / > "$RUNNER_TEMP/appium.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4723/status >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:4723/status >/dev/null || { echo "Appium failed to start"; cat "$RUNNER_TEMP/appium.log" 2>/dev/null; exit 1; }
          echo "Appium up on :4723"
          node nala/features/visual/sot-ios.run.js

  # Fan-in: fold every iOS shard (one per device x version) into the live
  # results.json (which also holds desktop chrome/ipad/iphone) so /imagediff
  # shows everything side by side.
  publish:
    needs: capture
    runs-on: [self-hosted, macOS, ios-sim]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install milo dependencies
        run: npm ci

      - name: Merge iOS shards into results.json and upload
        env:
          SITE: ${{ inputs.site }}
          IOS_VERSIONS: ${{ inputs.ios_versions }}
          DEVICES: ${{ inputs.devices }}
          NALA_BASE: http://nala-auto.corp.adobe.com
          S3_ACCESS_KEY_ID: ${{ secrets.S3ACCESSKEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3SECRETKEY }}
        run: |
          DIR="screenshots/$SITE"
          mkdir -p "$DIR"
          # Start from the currently-published results.json (desktop viewports).
          curl -sSf -o "$DIR/results.json" "$NALA_BASE/api/milo/screenshots/$SITE/results.json" || echo '{}' > "$DIR/results.json"
          # Pull every iOS shard we just uploaded (one per device x version).
          IFS=',' read -ra VL <<< "$IOS_VERSIONS"
          IFS=',' read -ra DL <<< "$DEVICES"
          for v in "${VL[@]}"; do
            v="$(echo "$v" | sed 's/ //g')"
            for dev in "${DL[@]}"; do
              sl="$(echo "$dev" | tr -cd 'A-Za-z0-9')"
              f="results-ios$v-$sl.json"
              curl -sSf -o "$DIR/$f" "$NALA_BASE/api/milo/screenshots/$SITE/$f" \
                && echo "✓ pulled $f" || echo "::warning::no $f on S3"
            done
          done
          # Merge all iOS shards into results.json (iOS keys are distinct: <page>-ios<ver>-<device>).
          node -e "const fs=require('fs');const d='$DIR';let r={};try{r=JSON.parse(fs.readFileSync(d+'/results.json'))}catch(e){};for(const f of fs.readdirSync(d).filter(x=>/^results-ios.*\.json$/.test(x))){try{Object.assign(r,JSON.parse(fs.readFileSync(d+'/'+f)))}catch(e){}}fs.writeFileSync(d+'/results.json',JSON.stringify(r,null,2));console.log('merged keys:',Object.keys(r).length)"
          node tools/screenshot-diff/lib/upload-one.js "$DIR/results.json"
          node -e "require('fs').writeFileSync('$DIR/timestamp.json',JSON.stringify([new Date().toLocaleString()],null,2))"
          node tools/screenshot-diff/lib/upload-one.js "$DIR/timestamp.json"

      - name: Print result URL
        run: echo "::notice title=View results::http://nala-auto.corp.adobe.com/imagediff/${{ inputs.site }}"
