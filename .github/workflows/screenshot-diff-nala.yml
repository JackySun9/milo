name: Screenshot Diff (Site SOT)

# Runs visual regression for one of the sites whose data lives at
# nala/features/visual/sot.<site>.yml.
#
# For each URL in the data file: captures twice — once unmodified, once
# with MILO_LIBS appended (default `?milolibs=stage`) — across the
# requested viewports, computes pixel diffs, uploads to internal S3.
#
# Use before promoting a milo stage→main change to verify it doesn't break
# a downstream site visually.
#
# Result URL after completion:
#   http://nala-auto.corp.adobe.com/imagediff/<site>

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site (matches nala/features/visual/sot.<site>.yml)'
        required: true
        default: 'bacom'
        type: choice
        options:
          - bacom
          - bacom-blog
          - cc
          - da-marketo
          - da-marketo-prod
          - dc
          - express
          - graybox-bacom
          - graybox-cc
          - graybox-dc
          - graybox-upp
          - homepage
          - uar
          - custom
      custom_site:
        description: 'Custom site name when site=custom, e.g. bacom-live-qa'
        required: false
        type: string
      viewports:
        description: 'Viewports (comma-separated)'
        required: false
        default: 'chrome'
        type: string
      milo_libs:
        description: 'Query string appended to URL B (the candidate)'
        required: false
        default: '?milolibs=stage'
        type: string

jobs:
  diff:
    name: ${{ inputs.site }} · ${{ inputs.viewports }}
    runs-on: [self-hosted, macOS, screendiff]
    timeout-minutes: 60
    env:
      SITE: ${{ inputs.site == 'custom' && inputs.custom_site || inputs.site }}
      CUSTOM_SITE: ${{ inputs.custom_site }}

    steps:
      - name: Validate site
        run: |
          if [ "${{ inputs.site }}" = "custom" ] && [ -z "$SITE" ]; then
            echo "::error::custom_site is required when site=custom"
            exit 1
          fi
          if [ "${{ inputs.site }}" != "custom" ] && [ -n "$CUSTOM_SITE" ]; then
            echo "::error::custom_site must be empty unless site=custom"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install milo dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual diff
        env:
          VIEWPORTS: ${{ inputs.viewports }}
          MILO_LIBS: ${{ inputs.milo_libs }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3ACCESSKEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3SECRETKEY }}
        run: node nala/features/visual/sot.run.js

      - name: Upload artifacts to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diff-${{ env.SITE }}-${{ inputs.viewports }}
          path: screenshots/${{ env.SITE }}/
          retention-days: 7

      - name: Print result URL
        if: success()
        run: |
          echo "::notice title=View results::http://nala-auto.corp.adobe.com/imagediff/${{ env.SITE }}"
