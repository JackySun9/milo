name: Brand Concierge Agent

# Runs the standard Brand Concierge health-check workflow (tools/bc-agent)
# against any Brand Concierge page, on the same self-hosted Mac mini pool
# used by screenshot-diff (see screenshot-diff-nala-parallel.yml).
#
# Triggered by nala-auto's workflow_dispatch, the same architecture as
# screenshot-diff: nala-auto dispatches this workflow, the runner does the
# work, and results are published as a GitHub Actions artifact that
# nala-auto can link back to via the run URL.
#
# Suites (non-LLM; replies are classified by rendered widgets):
#   monitor (default) - one short conversation per BC agent/route (Product
#     Advisor, pricing, Acrobat CTA, Genie, Firefly, Book a Meeting, Live
#     Agent, guardrails). Prompts rotate through a PRIVATE pool from the
#     BC_MONITOR_POOL secret (JSON or base64 JSON); without it the public
#     example pool is used. Because this repository is public, the monitor
#     never prints prompts to the log and does not upload a GitHub artifact;
#     the full report goes to internal S3 only.
#   explore - the original explorer-based 6-check workflow.
# Secrets: S3ACCESSKEY / S3SECRETKEY (publishing), BC_MONITOR_POOL (monitor).
#
# S3 contract (bucket `milo`, see tools/bc-agent/lib/publish.js):
#   screenshots/bc-agent/runs/<run_id>/workflow-summary.json|.md, report.html|.json, *.png
#   screenshots/bc-agent/runs/index.json   (newest first, 50 max)
#   screenshots/bc-agent/latest.json       (newest run entry)
# Read via http://nala-auto.corp.adobe.com/api/milo/<key>.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Version id for this run, used in the artifact name. Defaults to this GitHub run id.'
        required: false
        type: string
      url:
        description: 'Brand Concierge page to test (any http(s) URL: stage, prod, or a branch/AEM preview build).'
        required: true
        default: 'https://business.stage.adobe.com/?milolibs=stage'
        type: string
      suite:
        description: 'monitor = one conversation per BC agent (private prompt pool); explore = original 6-check explorer.'
        required: false
        default: 'monitor'
        type: choice
        options:
          - monitor
          - explore

jobs:
  run-agent:
    name: brand-concierge-agent
    # Disabled: the live-agent check opened real sales-advisor chats (ICX, 9/29).
    # Re-enable only by setting the repository variable BC_AGENT_ENABLED=true.
    if: vars.BC_AGENT_ENABLED == 'true'
    runs-on: [self-hosted, macOS, screendiff]
    timeout-minutes: 30
    env:
      RUN_ID: ${{ inputs.run_id || github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SUITE: ${{ inputs.suite || 'monitor' }}
      OUT_DIR: ${{ github.workspace }}/tools/bc-agent/reports/run
    defaults:
      run:
        working-directory: tools/bc-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          case "$TARGET_URL" in
            http://*|https://*) ;;
            *) echo "::error::url must be an http(s) URL"; exit 1 ;;
          esac
          if ! printf '%s' "$RUN_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' || printf '%s' "$RUN_ID" | grep -q '\.\.'; then
            echo "::error::run_id may only contain letters, digits, dot, dash, underscore (max 64)"
            exit 1
          fi

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/bc-agent/package-lock.json

      - name: Install bc-agent dependencies
        id: install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Brand Concierge ${{ env.SUITE }}
        env:
          BC_WORKFLOW_URL: ${{ inputs.url }}
          BC_WORKFLOW_OUT: ${{ env.OUT_DIR }}
          BC_RUN_ID: ${{ env.RUN_ID }}
          BC_RUN_URL: ${{ env.RUN_URL }}
          BC_MONITOR_POOL: ${{ secrets.BC_MONITOR_POOL }}
        run: |
          if [ "$SUITE" = "monitor" ]; then
            node monitor.mjs
          else
            node workflow-business-stage.mjs
          fi

      # Runs even when the agent reports REVIEW/fails, so the current status
      # and whatever screenshots exist still reach nala-auto.
      - name: Publish status and screenshots to S3
        if: always() && steps.install.outcome == 'success'
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3ACCESSKEY }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3SECRETKEY }}
          TARGET_URL: ${{ inputs.url }}
        run: node publish-s3.mjs --dir "$OUT_DIR" --run-id "$RUN_ID" --url "$TARGET_URL" --run-url "$RUN_URL" --suite "$SUITE"

      - name: Set artifact name
        if: always()
        id: artifact
        run: echo "name=bc-agent-$RUN_ID" >> "$GITHUB_OUTPUT"

      # Artifacts on a public repository are public; the monitor report holds
      # private prompts, so it is published to internal S3 only.
      - name: Upload report (HTML, JSON, summary, screenshots)
        if: always() && env.SUITE != 'monitor'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: tools/bc-agent/reports/run/
          retention-days: 7
          if-no-files-found: warn

      - name: Print result
        if: always()
        run: |
          if [ -f reports/run/workflow-summary.md ]; then
            cat reports/run/workflow-summary.md
          fi
          echo "::notice title=View results::http://nala-auto.corp.adobe.com/bc-agent (report: http://nala-auto.corp.adobe.com/api/milo/screenshots/bc-agent/runs/$RUN_ID/report.html)"
